apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: threshold
spec:
  description: >-
    Threshold platform components: operators, secrets plumbing, object storage,
    CI glue, observability, cluster access, and the GitOps root itself.
  sourceRepos:
    - git@github.com:fbialogrecki/threshold-gitops.git
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://cloudnative-pg.github.io/charts
    - https://charts.external-secrets.io
    - https://nats-io.github.io/k8s/helm/charts/
    - https://seaweedfs.github.io/seaweedfs/helm
    - https://woodpecker-ci.org/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: authentik
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: seaweedfs
    - server: https://kubernetes.default.svc
      namespace: woodpecker
    - server: https://kubernetes.default.svc
      namespace: woodpecker-jobs
    - server: https://kubernetes.default.svc
      namespace: woodpecker-release
    - server: https://kubernetes.default.svc
      namespace: nats
    - server: https://kubernetes.default.svc
      namespace: default
    # media-s3 ExternalSecret lives in threshold until the media service app owns it.
    - server: https://kubernetes.default.svc
      namespace: threshold
    - server: https://kubernetes.default.svc
      namespace: internal
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    # cert-manager leader-election Roles/RoleBindings land in kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: external-secrets.io
      kind: ClusterSecretStore
