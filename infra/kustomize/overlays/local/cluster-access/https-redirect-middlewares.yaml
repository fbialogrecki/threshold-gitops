apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  redirectScheme:
    scheme: https
    permanent: true
