apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-secrets
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: social-secrets
    creationPolicy: Owner
  data:
    - secretKey: THRESHOLD_INTERNAL_TOKEN
      remoteRef:
        key: threshold/internal
        property: THRESHOLD_INTERNAL_TOKEN
