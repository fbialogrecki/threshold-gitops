apiVersion: v1
kind: ServiceAccount
metadata:
  name: woodpecker-github-writer-reader
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-github-writer-reader
    app.kubernetes.io/part-of: threshold
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woodpecker-github-writer-secret-reader
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-github-writer-secret-reader
    app.kubernetes.io/part-of: threshold
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["woodpecker-github-writer"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["woodpecker-release-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-github-writer-secret-reader
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-github-writer-secret-reader
    app.kubernetes.io/part-of: threshold
subjects:
  - kind: ServiceAccount
    name: woodpecker-github-writer-reader
    namespace: woodpecker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woodpecker-github-writer-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-github-writer
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-github-writer
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: woodpecker-github-writer
    creationPolicy: Owner
  data:
    - secretKey: GIT_USERNAME
      remoteRef:
        key: threshold/ci/github-writer
        property: GIT_USERNAME
    - secretKey: GIT_TOKEN
      remoteRef:
        key: threshold/ci/github-writer
        property: GIT_TOKEN
