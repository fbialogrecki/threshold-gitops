apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-gateway
  labels:
    app.kubernetes.io/name: auth-gateway
    app.kubernetes.io/part-of: threshold
spec:
  ingressClassName: traefik
  rules:
    - host: auth.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-gateway
                port:
                  name: http
