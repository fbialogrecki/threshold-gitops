apiVersion: batch/v1
kind: Job
metadata:
  name: events-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: events
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: threshold
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: threshold
    spec:
      restartPolicy: OnFailure
      serviceAccountName: events
      containers:
        - name: migrate
          image: threshold/events:dev
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "python", "-m", "events.migrate"]
          envFrom:
            - configMapRef:
                name: events-config
            - secretRef:
                name: events-secrets
          env:
            - name: THRESHOLD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: events-postgres-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
