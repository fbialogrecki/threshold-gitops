apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threshold-loki
  namespace: argocd
  labels:
    app.kubernetes.io/name: threshold-loki
    app.kubernetes.io/part-of: threshold
    app.kubernetes.io/component: observability
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.0.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/infra/helm/loki/values.yaml
    - repoURL: git@github.com:fbialogrecki/threshold.git
      targetRevision: gitops
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
