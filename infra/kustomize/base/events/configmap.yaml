apiVersion: v1
kind: ConfigMap
metadata:
  name: events-config
  labels:
    app.kubernetes.io/name: events
    app.kubernetes.io/part-of: threshold
data:
  THRESHOLD_ENVIRONMENT: local
  THRESHOLD_SERVICE_NAME: events
  THRESHOLD_NATS_ENABLED: "false"
  THRESHOLD_NATS_URL: nats://nats.nats.svc.cluster.local:4222
  THRESHOLD_USERS_BASE_URL: http://users.threshold.svc.cluster.local:8000
  OTEL_SERVICE_NAME: events
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=threshold
