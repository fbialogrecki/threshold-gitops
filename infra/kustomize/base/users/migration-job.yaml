apiVersion: batch/v1
kind: Job
metadata:
  name: users-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: threshold
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: threshold
    spec:
      restartPolicy: OnFailure
      serviceAccountName: users
      containers:
        - name: migrate
          image: threshold/users:dev
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "python", "-m", "users.migrate"]
          envFrom:
            - configMapRef:
                name: users-config
            - secretRef:
                name: users-auth
          env:
            - name: THRESHOLD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: users-db
                  key: THRESHOLD_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
