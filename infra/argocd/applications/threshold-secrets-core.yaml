apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threshold-secrets-core
  namespace: argocd
  labels:
    app.kubernetes.io/name: threshold-secrets-core
    app.kubernetes.io/part-of: threshold
    app.kubernetes.io/component: secrets-core
spec:
  project: platform
  source:
    repoURL: git@github.com:fbialogrecki/threshold-gitops.git
    targetRevision: main
    path: infra/kustomize/base/platform/secrets-core
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    # prune stays off permanently: pruning the ClusterSecretStore would break
    # every ExternalSecret in the cluster.
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
