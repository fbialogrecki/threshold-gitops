apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-internal-tls
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: authentik-internal-tls
  commonName: authentik.internal
  dnsNames:
    - authentik.internal
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: threshold-internal-ca
    kind: ClusterIssuer
