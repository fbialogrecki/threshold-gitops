apiVersion: batch/v1
kind: Job
metadata:
  name: media-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: threshold
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: threshold
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      serviceAccountName: media
      containers:
        - name: migrate
          image: threshold/media:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /app/services/media
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: media-config
            - secretRef:
                name: media-secrets
            - secretRef:
                name: media-s3
          env:
            - name: THRESHOLD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: media-postgres-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
