apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: social-postgres-backup-store
  labels:
    app.kubernetes.io/name: social-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: threshold
    app.kubernetes.io/managed-by: argocd
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://threshold-cnpg-backups/social-postgres
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: social-postgres-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: social-postgres-backup-s3
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
