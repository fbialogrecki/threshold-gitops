apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-gateway-config
  labels:
    app.kubernetes.io/name: auth-gateway
    app.kubernetes.io/part-of: threshold
data:
  THRESHOLD_ENVIRONMENT: local
  THRESHOLD_SERVICE_NAME: auth-gateway
  THRESHOLD_AUTHENTIK_ISSUER: http://authentik-server.authentik.svc.cluster.local/application/o/threshold/
  THRESHOLD_AUTHENTIK_JWKS_URL: http://authentik-server.authentik.svc.cluster.local/application/o/threshold/jwks/
  THRESHOLD_USERS_BASE_URL: http://users.threshold.svc.cluster.local
  THRESHOLD_USERS_TIMEOUT_SECONDS: "2.0"
  THRESHOLD_USERS_TRANSPORT: nats
  THRESHOLD_NATS_URL: nats://nats.nats.svc.cluster.local:4222
  THRESHOLD_USERS_CURRENT_PROFILE_SUBJECT: users.current_profile.v1
  OTEL_SERVICE_NAME: auth-gateway
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=threshold
