apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threshold-external-secrets
  namespace: argocd
  annotations:
    # CRD/webhook operator; sync before consumers. Review gate:
    # docs/plans/platform-helm-release-adoption-review.md
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: threshold-external-secrets
    app.kubernetes.io/part-of: threshold
    app.kubernetes.io/component: platform-operators
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.4.0
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # CRDs exceed kubectl client-side apply annotation limits on repeat sync.
      - ServerSideApply=true
