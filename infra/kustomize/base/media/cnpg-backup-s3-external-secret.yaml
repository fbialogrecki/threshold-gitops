apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-postgres-backup-s3
  namespace: threshold
  labels:
    app.kubernetes.io/name: media-postgres
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: media-postgres-backup-s3
    creationPolicy: Owner
  data:
    # Shared cnpg-backup S3 identity, as for social
    # (docs/decisions/cnpg-social-backup-shared-identity.md): media reuses the
    # users OpenBao path and writes under its own bucket prefix.
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: threshold/cnpg/users-postgres/s3
        property: ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: threshold/cnpg/users-postgres/s3
        property: SECRET_ACCESS_KEY
