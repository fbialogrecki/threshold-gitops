apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao
  namespace: default
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: threshold
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd,default-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - openbao.internal
      secretName: openbao-internal-tls
  rules:
    - host: openbao.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
