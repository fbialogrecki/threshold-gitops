apiVersion: v1
kind: ConfigMap
metadata:
  name: users-config
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: threshold
data:
  THRESHOLD_ENVIRONMENT: local
  THRESHOLD_SERVICE_NAME: users
  THRESHOLD_NATS_ENABLED: "true"
  THRESHOLD_NATS_URL: nats://nats.nats.svc.cluster.local:4222
  THRESHOLD_USERS_CURRENT_PROFILE_SUBJECT: users.current_profile.v1
  THRESHOLD_SOCIAL_SERVICE_URL: http://social.threshold.svc.cluster.local
  THRESHOLD_EVENTS_SERVICE_URL: http://events.threshold.svc.cluster.local
  THRESHOLD_MEDIA_SERVICE_URL: http://media.threshold.svc.cluster.local
  OTEL_SERVICE_NAME: users
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=threshold
  THRESHOLD_SMTP_HOST: smtp.resend.com
  THRESHOLD_SMTP_PORT: "587"
  THRESHOLD_SMTP_SECURITY: starttls
  THRESHOLD_SMTP_TIMEOUT_SECONDS: "10"
