apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: threshold
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: users
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users
        app.kubernetes.io/part-of: threshold
    spec:
      serviceAccountName: users
      containers:
        - name: users
          image: threshold/users:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: users-config
            - secretRef:
                name: users-auth
            - secretRef:
                name: social-secrets
          env:
            - name: THRESHOLD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: users-db
                  key: THRESHOLD_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
