apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-s3
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: media-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MEDIA_S3_ENDPOINT_URL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
        MEDIA_S3_BUCKET: threshold-media
        MEDIA_S3_REGION: us-east-1
        MEDIA_S3_PATH_STYLE: "true"
        MEDIA_S3_ACCESS_KEY_ID: '{{ .S3_ACCESS_KEY_ID }}'
        MEDIA_S3_SECRET_ACCESS_KEY: '{{ .S3_SECRET_ACCESS_KEY }}'
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: threshold/media/s3
        property: ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: threshold/media/s3
        property: SECRET_ACCESS_KEY
