apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-smoke
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-smoke
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: threshold/eso-smoke
        property: value
