apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threshold-ci
  namespace: argocd
  labels:
    app.kubernetes.io/name: threshold-ci
    app.kubernetes.io/part-of: threshold
    app.kubernetes.io/component: ci
spec:
  project: platform
  source:
    repoURL: git@github.com:fbialogrecki/threshold.git
    targetRevision: gitops
    path: infra/kustomize/base/ci
  destination:
    server: https://kubernetes.default.svc
    namespace: woodpecker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
