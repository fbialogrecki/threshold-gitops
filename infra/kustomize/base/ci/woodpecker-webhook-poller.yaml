apiVersion: v1
kind: ServiceAccount
metadata:
  name: woodpecker-webhook-poller
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-webhook-poller
    app.kubernetes.io/part-of: threshold
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woodpecker-webhook-poller-state
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-webhook-poller
    app.kubernetes.io/part-of: threshold
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["woodpecker-webhook-poller-state"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-webhook-poller-state
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-webhook-poller
    app.kubernetes.io/part-of: threshold
subjects:
  - kind: ServiceAccount
    name: woodpecker-webhook-poller
    namespace: woodpecker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woodpecker-webhook-poller-state
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: woodpecker-webhook-poller-script
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-webhook-poller
    app.kubernetes.io/part-of: threshold
data:
  poll.py: |
    import base64
    import datetime as dt
    import hashlib
    import hmac
    import json
    import os
    import sqlite3
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = os.getenv("POD_NAMESPACE", "woodpecker")
    STATE_CONFIGMAP = os.getenv("STATE_CONFIGMAP", "woodpecker-webhook-poller-state")
    REPO = os.getenv("GITHUB_REPO", "fbialogrecki/threshold")
    BRANCH = os.getenv("GITHUB_BRANCH", "main")
    WOODPECKER_HOOK_URL = os.getenv(
        "WOODPECKER_HOOK_URL", "http://woodpecker-server/api/hook"
    )
    WOODPECKER_SQLITE = os.getenv(
        "WOODPECKER_SQLITE", "/var/lib/woodpecker/woodpecker.sqlite"
    )
    SA_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    KUBE_HOST = os.environ["KUBERNETES_SERVICE_HOST"]
    KUBE_PORT = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    KUBE_API = f"https://{KUBE_HOST}:{KUBE_PORT}/api/v1"


    def now_iso() -> str:
        return dt.datetime.now(dt.UTC).replace(microsecond=0).isoformat()


    def b64url(raw: bytes) -> bytes:
        return base64.urlsafe_b64encode(raw).rstrip(b"=")


    def http_json(url: str, *, method: str = "GET", headers=None, body=None):
        data = None if body is None else json.dumps(body, separators=(",", ":")).encode()
        req = urllib.request.Request(url, data=data, method=method)
        for key, value in (headers or {}).items():
            req.add_header(key, value)
        context = ssl.create_default_context(cafile=SA_CA_PATH) if url.startswith(KUBE_API) else None
        with urllib.request.urlopen(req, timeout=30, context=context) as res:
            text = res.read().decode()
            return res.status, json.loads(text) if text else None


    def kube_headers(content_type: str = "application/json") -> dict[str, str]:
        token = open(SA_TOKEN_PATH, encoding="utf-8").read().strip()
        return {"Authorization": f"Bearer {token}", "Content-Type": content_type}


    def get_state() -> dict[str, str]:
        try:
            _, body = http_json(
                f"{KUBE_API}/namespaces/{NAMESPACE}/configmaps/{STATE_CONFIGMAP}",
                headers=kube_headers(),
            )
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
            http_json(
                f"{KUBE_API}/namespaces/{NAMESPACE}/configmaps",
                method="POST",
                headers=kube_headers(),
                body={
                    "apiVersion": "v1",
                    "kind": "ConfigMap",
                    "metadata": {
                        "name": STATE_CONFIGMAP,
                        "labels": {
                            "app.kubernetes.io/name": "woodpecker-webhook-poller",
                            "app.kubernetes.io/part-of": "threshold",
                        },
                    },
                    "data": {},
                },
            )
            return {}
        return (body or {}).get("data", {}) or {}


    def patch_state(values: dict[str, str]) -> None:
        http_json(
            f"{KUBE_API}/namespaces/{NAMESPACE}/configmaps/{STATE_CONFIGMAP}",
            method="PATCH",
            headers=kube_headers("application/merge-patch+json"),
            body={"data": values},
        )


    def github_latest_commit() -> dict:
        req = urllib.request.Request(
            f"https://api.github.com/repos/{REPO}/commits/{BRANCH}",
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": "threshold-woodpecker-webhook-poller",
                "X-GitHub-Api-Version": "2022-11-28",
            },
        )
        with urllib.request.urlopen(req, timeout=30) as res:
            return json.loads(res.read().decode())


    def woodpecker_repo() -> tuple[str, str, str]:
        con = sqlite3.connect(f"file:{WOODPECKER_SQLITE}?mode=ro", uri=True)
        try:
            row = con.execute(
                "select forge_id, forge_remote_id, hash from repos where full_name = ? and active = 1",
                (REPO,),
            ).fetchone()
        finally:
            con.close()
        if row is None:
            raise RuntimeError(f"active Woodpecker repo not found for {REPO}")
        return str(row[0]), str(row[1]), str(row[2])


    def hook_token(forge_id: str, forge_remote_id: str, secret: str) -> str:
        header = {"alg": "HS256", "typ": "JWT"}
        payload = {
            "repo-forge-remote-id": forge_remote_id,
            "forge-id": forge_id,
            "type": "hook",
        }
        signing = b".".join(
            [
                b64url(json.dumps(header, separators=(",", ":")).encode()),
                b64url(json.dumps(payload, separators=(",", ":")).encode()),
            ]
        )
        sig = b64url(hmac.new(secret.encode(), signing, hashlib.sha256).digest())
        return (signing + b"." + sig).decode()


    def post_woodpecker_hook(
        access_token: str,
        latest: dict,
        before_sha: str,
        forge_remote_id: str,
    ) -> dict:
        repo_owner, repo_name = REPO.split("/", 1)
        sha = latest["sha"]
        commit = latest.get("commit", {})
        author = commit.get("author", {}) or {}
        committer = commit.get("committer", {}) or author
        payload = {
            "ref": f"refs/heads/{BRANCH}",
            "before": before_sha,
            "after": sha,
            "repository": {
                "id": int(forge_remote_id),
                "name": repo_name,
                "full_name": REPO,
                "clone_url": f"https://github.com/{REPO}.git",
                "ssh_url": f"git@github.com:{REPO}.git",
                "html_url": f"https://github.com/{REPO}",
                "default_branch": BRANCH,
                "private": True,
                "owner": {"name": repo_owner, "login": repo_owner},
            },
            "pusher": {"name": repo_owner, "email": author.get("email", "")},
            "sender": {"login": repo_owner},
            "head_commit": {
                "id": sha,
                "message": commit.get("message", ""),
                "timestamp": author.get("date"),
                "url": latest.get("html_url"),
                "author": {
                    "name": author.get("name", repo_owner),
                    "email": author.get("email", ""),
                    "username": repo_owner,
                },
                "committer": {
                    "name": committer.get("name", repo_owner),
                    "email": committer.get("email", ""),
                    "username": repo_owner,
                },
                "added": [],
                "removed": [],
                "modified": [],
            },
            "commits": [],
        }
        url = f"{WOODPECKER_HOOK_URL}?access_token={access_token}"
        req = urllib.request.Request(
            url,
            data=json.dumps(payload, separators=(",", ":")).encode(),
            method="POST",
            headers={
                "Content-Type": "application/json",
                "X-GitHub-Event": "push",
                "X-GitHub-Delivery": f"threshold-poller-{sha[:12]}",
                "User-Agent": "threshold-woodpecker-webhook-poller",
            },
        )
        with urllib.request.urlopen(req, timeout=60) as res:
            text = res.read().decode()
            return json.loads(text) if text else {"status": res.status}


    def main() -> int:
        state = get_state()
        latest = github_latest_commit()
        sha = latest["sha"]
        checked_at = now_iso()
        last_sha = state.get("last_sha", "").strip()

        if not last_sha:
            patch_state(
                {
                    "last_sha": sha,
                    "last_checked_at": checked_at,
                    "last_error": "",
                }
            )
            print(f"initialized state at {sha[:7]}; no pipeline triggered")
            return 0

        if last_sha == sha:
            patch_state({"last_checked_at": checked_at, "last_error": ""})
            print(f"no change on {REPO}@{BRANCH}: {sha[:7]}")
            return 0

        forge_id, forge_remote_id, secret = woodpecker_repo()
        token = hook_token(forge_id, forge_remote_id, secret)
        try:
            pipeline = post_woodpecker_hook(token, latest, last_sha, forge_remote_id)
        except Exception as exc:
            patch_state({"last_checked_at": checked_at, "last_error": str(exc)[:500]})
            raise

        hook_status = str(pipeline.get("status", "accepted"))
        pipeline_number = pipeline.get("number")
        patch_state(
            {
                "last_sha": sha,
                "last_checked_at": checked_at,
                "last_pipeline_at": checked_at,
                "last_pipeline_number": str(pipeline_number or ""),
                "last_pipeline_status": hook_status,
                "last_error": "",
            }
        )
        if pipeline_number:
            print(
                f"triggered Woodpecker pipeline #{pipeline_number} "
                f"for {sha[:7]} status={pipeline.get('status')}"
            )
        else:
            print(f"accepted Woodpecker hook for {sha[:7]} status={hook_status}; no workflow created")
        return 0


    if __name__ == "__main__":
        try:
            raise SystemExit(main())
        except Exception as exc:
            print(f"ERROR: {exc}", file=sys.stderr)
            raise
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: woodpecker-webhook-poller
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-webhook-poller
    app.kubernetes.io/part-of: threshold
spec:
  suspend: true
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: woodpecker-webhook-poller
            app.kubernetes.io/part-of: threshold
        spec:
          restartPolicy: Never
          serviceAccountName: woodpecker-webhook-poller
          containers:
            - name: poller
              image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
              imagePullPolicy: IfNotPresent
              command: ["python", "/scripts/poll.py"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: GITHUB_REPO
                  value: fbialogrecki/threshold
                - name: GITHUB_BRANCH
                  value: main
                - name: WOODPECKER_HOOK_URL
                  value: http://woodpecker-server/api/hook
                - name: WOODPECKER_SQLITE
                  value: /var/lib/woodpecker/woodpecker.sqlite
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: data
                  mountPath: /var/lib/woodpecker
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: woodpecker-webhook-poller-script
            - name: data
              persistentVolumeClaim:
                claimName: data-woodpecker-server-0
                readOnly: true
