apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-postgres-backup-s3
  namespace: threshold
  labels:
    app.kubernetes.io/name: social-postgres
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: social-postgres-backup-s3
    creationPolicy: Owner
  data:
    # Shared cnpg-backup S3 identity (2026-06-13 decision): social reuses the
    # users OpenBao path because both clusters back up to the same bucket under
    # the same identity. A dedicated social identity/path is a tracked follow-up
    # (docs/decisions/cnpg-social-backup-shared-identity.md).
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: threshold/cnpg/users-postgres/s3
        property: ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: threshold/cnpg/users-postgres/s3
        property: SECRET_ACCESS_KEY
