apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threshold-cnpg-operator
  namespace: argocd
  annotations:
    # CRD/webhook operator; sync before CNPG consumers. Review gate:
    # docs/plans/platform-helm-release-adoption-review.md
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: threshold-cnpg-operator
    app.kubernetes.io/part-of: threshold
    app.kubernetes.io/component: platform-operators
spec:
  project: platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.28.0
    helm:
      releaseName: cnpg-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # CRDs exceed kubectl client-side apply annotation limits on repeat sync.
      - ServerSideApply=true
