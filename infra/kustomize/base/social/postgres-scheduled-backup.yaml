apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: social-postgres-daily
  labels:
    app.kubernetes.io/name: social-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: threshold
spec:
  cluster:
    name: social-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  immediate: false
  target: primary
