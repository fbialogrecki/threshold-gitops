apiVersion: v1
kind: ServiceAccount
metadata:
  name: woodpecker-harbor-ci-reader
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-harbor-ci-reader
    app.kubernetes.io/part-of: threshold
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woodpecker-harbor-ci-secret-reader
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-harbor-ci-secret-reader
    app.kubernetes.io/part-of: threshold
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["woodpecker-harbor-ci"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["woodpecker-release-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-harbor-ci-secret-reader
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-harbor-ci-secret-reader
    app.kubernetes.io/part-of: threshold
subjects:
  - kind: ServiceAccount
    name: woodpecker-harbor-ci-reader
    namespace: woodpecker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woodpecker-harbor-ci-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-harbor-ci
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-harbor-ci
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: woodpecker-harbor-ci
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_USERNAME
      remoteRef:
        key: threshold/ci/harbor
        property: username
    - secretKey: HARBOR_PASSWORD
      remoteRef:
        key: threshold/ci/harbor
        property: password
