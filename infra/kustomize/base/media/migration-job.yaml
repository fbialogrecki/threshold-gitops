apiVersion: batch/v1
kind: Job
metadata:
  name: media-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: threshold
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: threshold
    spec:
      serviceAccountName: media
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: migrate
          image: threshold/media:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "media.migrate"]
          envFrom:
            - configMapRef:
                name: media-config
            - secretRef:
                name: media-secrets
            - secretRef:
                name: media-s3
          env:
            - name: HOME
              value: /tmp
            - name: THRESHOLD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: media-postgres-app
                  key: uri
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
