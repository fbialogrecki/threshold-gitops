apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users-auth
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: users-auth
    creationPolicy: Owner
  data:
    - secretKey: THRESHOLD_AUTH_PASSWORD_PEPPER_CURRENT
      remoteRef:
        key: threshold/users/auth
        property: THRESHOLD_AUTH_PASSWORD_PEPPER_CURRENT
    - secretKey: THRESHOLD_AUTH_PASSWORD_PEPPER_VERSION
      remoteRef:
        key: threshold/users/auth
        property: THRESHOLD_AUTH_PASSWORD_PEPPER_VERSION
    - secretKey: THRESHOLD_AUTH_SESSION_TOKEN_HMAC_KEY
      remoteRef:
        key: threshold/users/auth
        property: THRESHOLD_AUTH_SESSION_TOKEN_HMAC_KEY
    - secretKey: THRESHOLD_AUTH_AUDIT_HASH_KEY
      remoteRef:
        key: threshold/users/auth
        property: THRESHOLD_AUTH_AUDIT_HASH_KEY
