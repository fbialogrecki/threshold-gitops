apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users-db
  labels:
    app.kubernetes.io/name: users
    app.kubernetes.io/part-of: threshold
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: users-db
    creationPolicy: Owner
  data:
    - secretKey: THRESHOLD_DATABASE_URL
      remoteRef:
        key: threshold/users/db
        property: THRESHOLD_DATABASE_URL
