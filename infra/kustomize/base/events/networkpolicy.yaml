apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: events-ingress-from-web
  labels:
    app.kubernetes.io/name: events
    app.kubernetes.io/part-of: threshold
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: events
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: users
      ports:
        - protocol: TCP
          port: 8000
