      "uid": "threshold-db-overview",
      "version": 1,
      "weekStart": ""
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-threshold-authentik
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboard-threshold-authentik
    app.kubernetes.io/part-of: threshold
  annotations:
    threshold.dev/source-file: infra/grafana/dashboards/threshold-authentik-overview.json
data:
  threshold-authentik-overview.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Dashboard contract",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "Per-Authentik MVP dashboard. Uses Loki event/log counts first because Authentik metrics names vary by chart/exporter. Replace LogQL with native metrics once Authentik Prometheus metrics are explicitly enabled."
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Login events",
          "description": "Successful/attempted login-related events from logs.",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "logs"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"$authentik_namespace\"} |~ \"(?i)(login|logged in|authentication succeeded|user_login)\" [5m]))",
              "legendFormat": "login",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Failed logins",
          "description": "Failed authentication events from logs.",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "logs"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"$authentik_namespace\"} |~ \"(?i)(failed login|login failed|authentication failed|invalid credentials|denied)\" [5m]))",
              "legendFormat": "failed",
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Token refresh / OAuth token events",
          "description": "Token lifecycle events from logs.",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "logs"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"$authentik_namespace\"} |~ \"(?i)(refresh_token|token refresh|oauth2/token|openid|authorization_code)\" [5m]))",
              "legendFormat": "token",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Authentik pod restarts",
          "description": "Restarts in Authentik namespace.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"$authentik_namespace\"}[6h]))",
              "legendFormat": "{{pod}} {{container}}",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Authentik HTTP 5xx (if instrumented)",
          "description": "5xx rate if Authentik metrics are scraped.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_seconds_count{namespace=\"$authentik_namespace\", http_response_status_code=~\"5..\"}[5m])) or sum(rate(http_requests_total{namespace=\"$authentik_namespace\", status=~\"5..\"}[5m]))",
              "legendFormat": "5xx",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Authentik warning/error logs",
          "description": "Authentik application log anomalies.",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "fieldConfig": {
            "defaults": {
              "unit": "logs"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (count_over_time({namespace=\"$authentik_namespace\"} |~ \"(?i)(error|exception|traceback|warning|critical)\" [5m]))",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Authentik DB connections (if labeled)",
          "description": "PostgreSQL connections for Authentik database if metrics expose datname.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, datname) (cnpg_backends_total{datname=~\".*authentik.*\"}) or sum by (pod, datname) (pg_stat_database_numbackends{datname=~\".*authentik.*\"})",
              "legendFormat": "{{datname}} {{pod}}",
              "range": true
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "threshold",
        "mvp",
        "authentik",
        "auth"
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Mimir",
              "value": "Mimir"
            },
            "label": "Metrics datasource",
            "hide": 0
          },
          {
            "name": "DS_LOKI",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "label": "Logs datasource",
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(kube_pod_info, namespace)",
            "current": {
              "text": "threshold",
              "value": "threshold"
            },
            "includeAll": false,
            "refresh": 1
          },
          {
            "name": "authentik_namespace",
            "type": "constant",
            "query": "authentik",
            "current": {
              "text": "authentik",
              "value": "authentik"
            },
            "label": "Authentik namespace"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Threshold / Authentik overview",
      "uid": "threshold-authentik-overview",
      "version": 1,
      "weekStart": ""
    }
